<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>portfolio</title>
    <!--
      GitHub Pages는 정적 호스팅이라 /work, /about 같은 경로를 새로고침하면
      해당 경로에 실제 파일이 없어 404를 띄웁니다.
      이 스크립트는 요청 경로를 쿼리스트링으로 인코딩해 index.html로 리다이렉트하고,
      index.html의 스크립트가 다시 원래 경로로 복원해 React Router가 처리하게 합니다.
      (spa-github-pages 패턴, base가 '/portfolio/'이므로 pathSegmentsToKeep = 1)
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
